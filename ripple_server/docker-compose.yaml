services:
  # Development services
  postgres:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: ripple
      POSTGRES_PASSWORD: "78Af8E77OfNNGAf7vm3Y7-KesfRWnKQu"
    volumes:
      - ripple_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "7DeEnkcPThoeNDDXOeJ4EcnKkNn1_pjc"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: ripple_test
      POSTGRES_PASSWORD: "opgWihGJlzWolzKIuwz_GJTfbz0UguJP"
    volumes:
      - ripple_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "nWuC-d5zxJiZJ3jOnrarR7vun0Y00dwk"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  ripple_data:
  ripple_test_data:
