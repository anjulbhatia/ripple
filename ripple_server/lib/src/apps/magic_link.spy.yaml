# MagicLink: private sharing token for one app.
# appId refers to AppDefinition.id (enforced in endpoint code, not FK).
class: MagicLink
table: magic_links
fields:
  token: String, unique
  appId: int
  createdByUserId: UuidValue?
  expiresAt: DateTime?
  revoked: bool, default=false
  createdAt: DateTime, default=now
indexes:
  magic_links_app_idx:
    fields: appId
