# AppDefinition: declarative UI + metadata for one personal app.
# Agent outputs uiDefinition JSON against fixed component catalog.
# Flutter host renders it. Never free-form Flutter code.
class: AppDefinition
table: app_definitions
fields:
  # Owner (Serverpod auth user). Nullable so anonymous/dev use works
  # before sign-in is wired up. Gallery filters by this when signed in.
  ownerUserId: UuidValue?
  # Display name shown in gallery.
  name: String
  # Optional user prompt / notes.
  description: String?
  # Declarative UI JSON tree (component catalog contract). Stored as
  # String to keep payload opaque to the database.
  uiDefinition: String
  # Schema version of uiDefinition, bump when catalog changes.
  schemaVersion: int, default=1
  # Published to in-app Explore.
  isPublished: bool, default=false
  createdAt: DateTime, default=now
  updatedAt: DateTime, default=now
indexes:
  app_definitions_owner_idx:
    fields: ownerUserId
  app_definitions_updated_idx:
    fields: updatedAt
