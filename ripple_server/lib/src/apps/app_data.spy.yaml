# AppData: simple per-app user data (key-value scoped to app + user).
# No relations/joins on purpose: keeps MVP migration trivial.
# appId refers to AppDefinition.id (enforced in endpoint code, not FK).
class: AppData
table: app_data
fields:
  ownerUserId: UuidValue?
  appId: int
  dataKey: String
  # JSON-encoded value as String (number, string, bool, object, list).
  dataValue: String?
  updatedAt: DateTime, default=now
indexes:
  app_data_app_key_idx:
    fields: appId, dataKey
  app_data_owner_idx:
    fields: ownerUserId
