# OtpChallenge: one pending 4-digit email code for passwordless sign-in.
# Only a SHA-256 hash is stored, never the plain code. Codes expire
# after 10 minutes and are single-use.
class: OtpChallenge
table: otp_challenges
fields:
  email: String
  codeHash: String
  expiresAt: DateTime
  attempts: int, default=0
  consumed: bool, default=false
  createdAt: DateTime, default=now
indexes:
  otp_challenges_email_idx:
    fields: email
